{% extends 'base.html' %}
{% load static %}

{% block title %}Doctor Profile - Clinic On{% endblock %}

{% block content %}
  <section class="py-5" id="doctorDetailsSection">
    <div class="container">
      <!-- Dynamic details container -->
    </div>
  </section>
{% endblock %}

{% block extra_js %}
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const docId = urlParams.get('id') || 'doc_1';
      const doctor = ClinicStore.getDoctors().find(d => d.id === docId) || ClinicStore.getDoctors()[0];

      const container = document.getElementById('doctorDetailsSection');
      if (container && doctor) {
        container.innerHTML = `
          <div class="container">
            <div class="row g-4">
              <div class="col-lg-4">
                <div class="card p-3 text-center shadow-sm">
                  <img src="${doctor.image}" alt="${doctor.name}" class="rounded-4 img-fluid mb-3" style="max-height:280px; object-fit:cover;">
                  <h4 class="fw-bold mb-1">${doctor.name}</h4>
                  <span class="badge badge-info-custom mb-2">${doctor.specialization}</span>
                  <div class="text-warning fw-bold mb-3"><i class="bi bi-star-fill"></i> ${doctor.rating} (${doctor.reviewsCount} Patient Reviews)</div>
                  <a href="patient/book-appointment.html?docId=${doctor.id}" class="btn btn-primary-gradient w-100 py-2"><i class="bi bi-calendar-plus me-1"></i>Book Consultation Slot</a>
                </div>
              </div>

              <div class="col-lg-8">
                <div class="card p-4 shadow-sm h-100">
                  <h5 class="fw-bold mb-3">About ${doctor.name}</h5>
                  <p class="text-muted fs-7 mb-4">${doctor.about}</p>

                  <h6 class="fw-bold mb-2">Education &amp; Credentials</h6>
                  <p class="text-muted fs-7 mb-4"><i class="bi bi-mortarboard me-2 text-primary"></i>${doctor.education}</p>

                  <h6 class="fw-bold mb-2">Practice Details</h6>
                  <div class="row g-3 fs-7 mb-4">
                    <div class="col-md-6"><span class="text-muted">Department:</span> <strong>${doctor.department}</strong></div>
                    <div class="col-md-6"><span class="text-muted">Experience:</span> <strong>${doctor.experience}</strong></div>
                    <div class="col-md-6"><span class="text-muted">Consultation Hours:</span> <strong>${doctor.hours}</strong></div>
                    <div class="col-md-6"><span class="text-muted">Consultation Fee:</span> <strong class="text-success">${doctor.fee}</strong></div>
                  </div>

                  <a href="doctors.html" class="text-primary fw-semibold text-decoration-none fs-7"><i class="bi bi-arrow-left me-1"></i>Back to Doctors Directory</a>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    });
  </script>
{% endblock %}
