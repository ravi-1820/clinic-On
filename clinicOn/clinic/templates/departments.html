{% extends 'base.html' %}
{% load static %}

{% block title %}Medical Departments - Clinic On{% endblock %}

{% block content %}
  <section class="py-5">
    <div class="container">
      <div class="mb-4 text-center">
        <h3 class="fw-bold mb-1">Medical Departments</h3>
        <p class="text-muted fs-7">Specialized clinical care across key health departments.</p>
      </div>

      <div class="row g-4" id="publicDeptsGrid">
        <!-- Rendered via JS -->
      </div>
    </div>
  </section>
{% endblock %}

{% block extra_js %}
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const depts = ClinicStore.getDepartments();
      const grid = document.getElementById('publicDeptsGrid');
      if (grid) {
        grid.innerHTML = depts.map(d => `
          <div class="col-md-6 col-lg-4">
            <div class="card card-hover h-100 p-4">
              <div class="pastel-icon-box bg-pastel-blue mb-3" style="width:44px; height:44px; font-size:1.25rem;">
                <i class="bi ${d.icon}"></i>
              </div>
              <h5 class="fw-bold mb-1">${d.name}</h5>
              <p class="text-muted fs-7 mb-3">${d.desc}</p>
              <div class="mt-auto d-flex justify-content-between align-items-center border-top pt-2">
                <small class="text-muted">Head: ${d.head}</small>
                <a href="doctors.html?dept=${encodeURIComponent(d.name)}" class="btn btn-outline-primary btn-sm">Explore Doctors</a>
              </div>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
{% endblock %}
