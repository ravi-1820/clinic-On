{% load static %}
<!-- Sticky Frosted Glass Public Header -->
<header class="navbar navbar-expand-lg glass-navbar sticky-top-nav">
  <div class="container">
    <!-- Brand Logo Matching Login/Register -->
    <a class="brand-logo-text me-lg-2" href="{% url 'index' %}">
      <span class="brand-icon-box">
        <i class="bi bi-heart-pulse-fill"></i>
      </span>
      <span>Clinic <span class="brand-gradient-part">On</span></span>
    </a>

    <!-- Mobile Menu Hamburger Toggler -->
    <button class="navbar-toggler border-0 shadow-none p-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <i class="bi bi-list fs-2 text-foreground"></i>
    </button>

    <!-- Collapsible Navigation Menu -->
    <div class="collapse navbar-collapse" id="navbarMain">
      <!-- Searchbar between Logo and Menus with clear breathing room from logo -->
      <div class="ms-lg-4 ms-xl-5 me-lg-auto my-2 my-lg-0">
        <button type="button" class="btn header-search-btn command-palette-trigger d-flex align-items-center gap-2 rounded-pill px-3 py-1.5 fs-8" title="Quick Search (Ctrl + K)">
          <i class="bi bi-search"></i>
          <span>Search...</span>
          <kbd class="ms-2">Ctrl K</kbd>
        </button>
      </div>

      <!-- Navigation Menu Items -->
      <ul class="navbar-nav mb-2 mb-lg-0 gap-lg-1 me-lg-3 align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'index' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'doctors' or request.resolver_match.url_name == 'doctor_details' %}active{% endif %}" href="{% url 'doctors' %}">Doctors</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'departments' %}active{% endif %}" href="{% url 'departments' %}">Departments</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact</a>
        </li>
      </ul>

      <!-- Right Action Area -->
      <div class="d-flex align-items-center gap-2 flex-wrap" id="navAuthArea">
        {% if request.session.email %}
        <!-- Logout Link (Shown when user is logged in) -->
        <a href="{% url 'logout' %}" class="btn btn-ghost px-3 fw-semibold text-danger">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </a>
        {% else %}
        <!-- Login Link (Shown when user is logged out) -->
        <a href="{% url 'login' %}" class="btn btn-ghost px-3 fw-semibold">Login</a>
        {% endif %}

        <!-- Emerald Pill CTA -->
        <a href="{% url 'patient_book_appointment' %}" class="btn btn-emerald-pill">
          <i class="bi bi-calendar-plus me-1"></i> Book Appointment
        </a>

        <!-- Theme Switcher (Shifted to the LAST) -->
        <button type="button" class="theme-toggle-btn ms-1" title="Toggle Light/Dark Theme">
          <i class="bi bi-moon-stars"></i>
        </button>
      </div>
    </div>
  </div>
</header>
