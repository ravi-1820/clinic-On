{% extends 'base.html' %}
{% load static %}

{% block title %}Doctors Directory - Clinic On{% endblock %}

{% block content %}
  <section class="py-5">
    <div class="container">
      <div class="mb-4">
        <h3 class="fw-bold mb-1">Find Medical Specialists</h3>
        <p class="text-muted fs-7">Browse board-certified medical doctors, view available slots, and book instant consultations.</p>
      </div>

      <div class="card p-3 mb-4 shadow-sm">
        <div class="row g-3">
          <div class="col-md-6">
            <input type="text" class="form-control" id="publicDocSearch" placeholder="Search doctor by name or specialization...">
          </div>
          <div class="col-md-4">
            <select class="form-select" id="publicDocDeptFilter">
              <option value="">All Departments</option>
              <option value="Cardiology">Cardiology</option>
              <option value="Neurology">Neurology</option>
              <option value="Orthopedics">Orthopedics</option>
              <option value="Pediatrics">Pediatrics</option>
              <option value="Dermatology">Dermatology</option>
              <option value="General Medicine">General Medicine</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row g-4" id="publicDoctorsGrid">
        <!-- Rendered via JS -->
      </div>
    </div>
  </section>
{% endblock %}

{% block extra_js %}
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('publicDocSearch');
      const deptSelect = document.getElementById('publicDocDeptFilter');
      const grid = document.getElementById('publicDoctorsGrid');

      const urlParams = new URLSearchParams(window.location.search);
      const urlDept = urlParams.get('dept');
      if (urlDept && deptSelect) deptSelect.value = urlDept;

      function renderGrid() {
        const search = searchInput.value.toLowerCase().trim();
        const dept = deptSelect.value;
        const doctors = ClinicStore.getDoctors().filter(d => {
          const mSearch = d.name.toLowerCase().includes(search) || d.specialization.toLowerCase().includes(search);
          const mDept = !dept || d.department === dept;
          return mSearch && mDept;
        });

        if (doctors.length === 0) {
          grid.innerHTML = `<div class="col-12 text-center py-5 text-muted">No doctors found matching criteria.</div>`;
          return;
        }

        grid.innerHTML = doctors.map(doc => `
          <div class="col-md-6 col-lg-4">
            <div class="card card-hover h-100">
              <img src="${doc.image}" alt="${doc.name}" style="height:200px; object-fit:cover;" class="card-img-top">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <div>
                    <h6 class="fw-bold mb-1">${doc.name}</h6>
                    <span class="badge badge-info-custom">${doc.specialization}</span>
                  </div>
                  <div class="fs-7 text-warning fw-bold"><i class="bi bi-star-fill"></i> ${doc.rating}</div>
                </div>
                <p class="text-muted fs-7 mb-1"><i class="bi bi-briefcase me-1"></i>${doc.experience} Experience</p>
                <p class="text-muted fs-7 mb-3"><i class="bi bi-cash me-1"></i>Consultation Fee: <strong class="text-success">${doc.fee}</strong></p>
                <div class="mt-auto d-flex gap-2">
                  <a href="doctor-details.html?id=${doc.id}" class="btn btn-outline-primary btn-sm flex-grow-1">View Profile</a>
                  <a href="patient/book-appointment.html?docId=${doc.id}" class="btn btn-primary-gradient btn-sm flex-grow-1">Book Slot</a>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      }

      searchInput.addEventListener('input', renderGrid);
      deptSelect.addEventListener('change', renderGrid);
      renderGrid();
    });
  </script>
{% endblock %}
